[project]
name = "troyai-agency"
version = "1.0.0"
description = "TRoyAI E-Otomation Agency — Fully AI-Agent-Automated Company"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[project.scripts]
troyai = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
